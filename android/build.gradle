def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['MoxoModule_' + name]
}

def getExtOrIntegerDefault(name) {
  return getExtOrDefault(name).toInteger()
}

// AGP 9 compiles Kotlin itself unless the app opts out with android.builtInKotlin=false.
def builtInKotlin = (project.findProperty('android.builtInKotlin') ?: 'true').toString().toBoolean()

apply plugin: 'com.android.library'
if (!builtInKotlin) {
  apply plugin: 'org.jetbrains.kotlin.android'
}
apply plugin: 'com.facebook.react'

// The app has to resolve mep-sdk and its dependencies from the Moxo repository.
rootProject.allprojects {
  repositories {
    maven {
      url = 'https://mxrepo.moxo.com/repository/customer-maven-releases/'
    }
  }
}

android {
  namespace = 'com.moxomodule'
  compileSdk = getExtOrIntegerDefault('compileSdkVersion')

  defaultConfig {
    minSdk = getExtOrIntegerDefault('minSdkVersion')
    targetSdk = getExtOrIntegerDefault('targetSdkVersion')
  }

  buildTypes {
    release {
      minifyEnabled = false
    }
  }

  lint {
    disable 'GradleCompatible'
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }
}

if (!builtInKotlin) {
  kotlin {
    compilerOptions {
      jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'com.moxtra:mep-sdk:10.13.1'
}
